name: rentatool_mobile
description: "RentaTool LK - Peer-to-Peer Machinery & Equipment Rental System Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.2.2
  go_router: ^14.1.4
  intl: ^0.19.0
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  mobile_scanner: ^5.1.1
  qr_flutter: ^4.1.0
  google_maps_flutter: ^2.6.1
  geolocator: ^12.0.0
  uuid: ^4.4.0
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env

